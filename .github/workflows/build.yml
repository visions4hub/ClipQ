name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Arabic and English installers
        shell: cmd
        run: build.bat

      - name: Checksums
        shell: pwsh
        run: |
          Push-Location dist
          Get-ChildItem ClipQ-Setup-*.exe | ForEach-Object {
            "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Out-File SHA256SUMS.txt -Encoding ascii
          Get-Content SHA256SUMS.txt
          Pop-Location

      - uses: actions/upload-artifact@v4
        with:
          name: ClipQ-Setup
          path: |
            dist/ClipQ-Setup-*.exe
            dist/SHA256SUMS.txt

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist\ClipQ-Setup-AR.exe dist\ClipQ-Setup-EN.exe dist\SHA256SUMS.txt `
            --title "ClipQ ${{ github.ref_name }}" --notes-file .github\release-notes.md
